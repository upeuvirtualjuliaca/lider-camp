<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Calendario – público – celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; min-height: 1500px; background: #F4F6F4; font-family: Inter, system-ui, sans-serif; color: #16201B">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E3E7E4; height: 60px; padding: 0 8px; display: flex; align-items: center; gap: 4px">
    <a href="InicioPublicoMovil.dc.html" aria-label="Volver al inicio" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16201B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="flex: 1; font-size: 17px; font-weight: 800">Calendario</span>
  </header>

  <div role="tablist" aria-label="Día" style="position: sticky; top: 0; z-index: 2; background: #FFFFFF; border-bottom: 1px solid #E3E7E4; padding: 10px 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
      <button role="tab" onClick="{{d.pick}}" style="{{d.style}}">
        <span style="font-size: 14px; font-weight: 700">{{d.label}}</span>
        <span style="font-size: 11px">{{d.sub}}</span>
      </button>
    </sc-for>
  </div>

  <main style="padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <section style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 18px; font-weight: 800">Actividades</h2>
      <sc-for list="{{acts}}" as="a" hint-placeholder-count="2">
        <div style="display: flex; gap: 12px; align-items: center">
          <span style="width: 56px; flex-shrink: 0; height: 40px; border-radius: 10px; background: #E1F3EA; color: #0B6B4B; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">{{a.time}}</span>
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{a.name}}</span><span style="font-size: 13px; color: #5B6660">{{a.place}}</span></span>
        </div>
      </sc-for>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 18px; font-weight: 800">Se evalúa</h2><span style="font-size: 13px; color: #5B6660">{{count}} criterios</span></div>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #5B6660">{{g.name}}</span>
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{g.items}}" as="c" hint-placeholder-count="4">
              <span style="min-height: 34px; padding: 6px 12px; box-sizing: border-box; border-radius: 17px; background: #F4F6F4; border: 1px solid #E3E7E4; display: flex; align-items: center; font-size: 13px; font-weight: 500">{{c}}</span>
            </sc-for>
          </div>
        </div>
      </sc-for>
      <sc-if value="{{hasNot}}" hint-placeholder-val="{{ true }}">
        <p style="margin: 0; padding-top: 12px; border-top: 1px solid #EEF1EF; font-size: 13px; line-height: 1.5; color: #5B6660">No se evalúan este día: {{notToday}}</p>
      </sc-if>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 1.5; color: #3A4540">
      <span><strong>Inscripción:</strong> se califica una sola vez, según la fecha de inscripción.</span>
      <span><strong>Domingo 8:</strong> clausura y medallas; sin criterios evaluados.</span>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { day: 1 }; }
  renderVals() {
    const self = this;
    const G = [
      { name: 'Armado del campamento', rows: [['Carpas', 'JVS'], ['Cerco', 'JVS'], ['Basurero', 'VS'], ['Tendedero', 'VS'], ['Portada', 'JVS'], ['Limpieza dentro del campamento', 'JVS']] },
      { name: 'Orden y cocina', rows: [['Orden y limpieza interior', 'JVS'], ['Orden y limpieza exterior', 'JVS'], ['Uniforme de cocineros', 'VS'], ['Menú', 'VS'], ['Utiliza alimentos permitidos', 'JVS']] },
      { name: 'Ceremonias y participación', rows: [['Izamiento', 'JVS'], ['Barras de la mañana', 'JVS'], ['Barras de la noche', 'JVS'], ['Mascota de la escuela', 'JVS']] },
      { name: 'Liderazgo', rows: [['Cantidad de participantes', 'JVS'], ['Buen ánimo y espíritu de equipo', 'JVS']] }
    ];
    const D = [['J', 'Jue 5'], ['V', 'Vie 6'], ['S', 'Sáb 7']];
    const TODAY = 1;
    const ACTS = [
      [['16:30', 'Programa Apertura y Estelar 1', 'Centro de concentración']],
      [['15:00', 'Evento deportivo', 'Campo principal'], ['19:30', 'Programa estelar 2', 'Auditorio central']],
      [['10:00', 'Labor misionera', 'Comunidad cercana'], ['19:30', 'Programa estelar 3', 'Auditorio central']]
    ];
    const d = this.state.day, code = D[d][0];
    let count = 0; const not = [];
    const groups = G.map(function (g) {
      const items = [];
      g.rows.forEach(function (r) { if (r[1].indexOf(code) >= 0) { items.push(r[0]); count++; } else { not.push(r[0]); } });
      return { name: g.name, items: items };
    }).filter(function (g) { return g.items.length; });
    const days = D.map(function (x, i) {
      const on = d === i;
      return { label: x[1], sub: i === TODAY ? 'Hoy' : ACTS[i].length + ' act.', pick: function () { self.setState({ day: i }); },
        style: 'height: 52px; border-radius: 12px; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; ' + (on ? 'background: #0E7C59; color: #FFFFFF; border: 1px solid #0E7C59;' : 'background: #FFFFFF; color: #16201B; border: 1px solid #DCE1DD;') };
    });
    return {
      days: days, groups: groups, count: count, notToday: not.join(', '), hasNot: not.length > 0,
      acts: ACTS[d].map(function (a) { return { time: a[0], name: a[1], place: a[2] }; })
    };
  }
}
</script>
</body>
</html>
