<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Revisiones – celular – bandeja</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F4; font-family: Inter, system-ui, sans-serif; color: #16201B; display: flex; flex-direction: column; overflow: hidden">

  <header style="background: #FFFFFF; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #E3E7E4">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
      <button aria-label="Abrir menú" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #16201B">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
      <div style="display: flex; flex-direction: column; align-items: center">
        <span style="font-size: 17px; font-weight: 700">Revisiones</span>
        <span style="font-size: 12px; color: #5B6660">Administración</span>
      </div>
      <button aria-label="Mi cuenta" style="width: 36px; height: 36px; border-radius: 50%; border: 0; background: #0E7C59; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 14px">V</button>
    </div>
    <div role="tablist" aria-label="Estado" style="display: flex; gap: 18px; overflow-x: auto">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <button role="tab" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}<span style="{{t.countStyle}}">{{t.count}}</span></button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 48px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
        <span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 50%; background: #E1F3EA; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0E7C59" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
        <span style="font-size: 16px; font-weight: 700">Todo al día</span>
        <span style="font-size: 13px; color: #5B6660">No hay incidencias esperando revisión.</span>
      </div>
    </sc-if>
    <ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 16px; overflow: hidden">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
        <li style="border-bottom: 1px solid #EEF1EF">
          <a href="RevisionDetalleMovil.dc.html" style="display: flex; align-items: flex-start; gap: 12px; padding: 14px">
            <span style="{{it.codeStyle}}">{{it.code}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 14px; font-weight: 600">{{it.team}}</span><span style="{{it.ptsStyle}}">{{it.pts}}</span></span>
              <span style="font-size: 13px; color: #3A4540; line-height: 1.4">{{it.fact}}</span>
              <span style="display: flex; align-items: center; gap: 8px"><span style="{{it.stateStyle}}">{{it.state}}</span><span style="font-size: 12px; color: #5B6660">{{it.when}}</span></span>
            </span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A948E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 12px"><path d="M9 6l6 6-6 6"></path></svg>
          </a>
        </li>
      </sc-for>
    </ul>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'pend' }; }
  renderVals() {
    const self = this;
    const ST = {
      registrado: ['Registrada', 'background: #EEF0EE; color: #4A544F;'], descargo: ['En descargo', 'background: #FFF1D6; color: #7A4F00;'],
      validado: ['Validada', 'background: #E1F3EA; color: #0B6B4B;'], rechazado: ['Rechazada', 'background: #FDECEC; color: #A3261F;']
    };
    const all = [
      { code: 'B2', bonus: true, team: 'Nutrición Humana', when: 'Jue 5 · 11:40', fact: 'Prestó su cocina al equipo de Derecho.', st: 'descargo', pts: '+25' },
      { code: 'D1', bonus: false, team: 'Arquitectura', when: 'Jue 5 · 22:35', fact: 'Ruido tras la advertencia de las 22:10.', st: 'registrado', pts: '−10' },
      { code: 'B1', bonus: true, team: 'Educación', when: 'Jue 5 · 09:13', fact: 'Apoyó con la limpieza de los SS.HH.', st: 'validado', pts: '+25' },
      { code: 'B1', bonus: true, team: 'Educación', when: 'Jue 5 · 09:14', fact: 'Apoyó con la limpieza de los SS.HH.', st: 'rechazado', pts: '+25' },
      { code: 'B1', bonus: true, team: 'Educación', when: 'Jue 5 · 09:15', fact: 'Apoyó con la limpieza de los SS.HH.', st: 'rechazado', pts: '+25' }
    ];
    const match = function (it, t) {
      if (t === 'pend') return it.st === 'registrado' || it.st === 'descargo';
      if (t === 'val') return it.st === 'validado';
      if (t === 'rec') return it.st === 'rechazado';
      return true;
    };
    const tabs = [['pend', 'Pendientes'], ['val', 'Validadas'], ['rec', 'Rechazadas'], ['all', 'Todas']].map(function (d) {
      const on = self.state.tab === d[0];
      const n = all.filter(function (x) { return match(x, d[0]); }).length;
      return { label: d[1], count: n, pick: function () { self.setState({ tab: d[0] }); },
        style: 'flex-shrink: 0; border: 0; background: transparent; display: flex; align-items: center; gap: 6px; font: inherit; font-size: 14px; cursor: pointer; padding: 0 0 12px; ' + (on ? 'color: #0E7C59; font-weight: 600; box-shadow: inset 0 -2px 0 #0E7C59;' : 'color: #5B6660; font-weight: 500;'),
        countStyle: 'font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 8px; ' + (d[0] === 'pend' && n ? 'background: #0E7C59; color: #FFFFFF;' : 'background: #E3E7E4; color: #3A4540;') };
    });
    const items = all.filter(function (x) { return match(x, self.state.tab); }).map(function (r) {
      const rej = r.st === 'rechazado';
      return Object.assign({}, r, {
        state: ST[r.st][0], stateStyle: 'font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; ' + ST[r.st][1],
        codeStyle: 'flex-shrink: 0; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; ' + (r.bonus ? 'background: #E1F3EA; color: #0B6B4B;' : 'background: #FDECEC; color: #A3261F;'),
        ptsStyle: 'font-size: 14px; font-weight: 700; ' + (rej ? 'color: #8A948E; text-decoration: line-through;' : (r.bonus ? 'color: #0B6B4B;' : 'color: #A3261F;'))
      });
    });
    return { tabs: tabs, items: items, empty: items.length === 0 };
  }
}
</script>
</body>
</html>
