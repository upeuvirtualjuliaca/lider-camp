<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Incidencias – tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; background: #F4F6F4; font-family: Inter, system-ui, sans-serif; color: #16201B; display: flex; overflow: hidden">

  <nav aria-label="Menú principal" style="width: 88px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #E3E7E4; display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 6px">
    <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: #0E7C59; display: flex; align-items: center; justify-content: center; margin-bottom: 14px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18L12 4 3 20z"></path><path d="M10 20l2-4 2 4"></path></svg>
    </span>
    <a href="InicioTablet.dc.html" style="width: 72px; padding: 8px 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5B6660"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
    <a href="TabletEquipo.dc.html" style="width: 72px; padding: 8px 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5B6660"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"></path><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"></path></svg>Evaluar</a>
    <a href="ActividadesTablet.dc.html" style="width: 72px; padding: 8px 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5B6660"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.9"></path></svg>Actividades</a>
    <a href="#" aria-current="page" style="width: 72px; padding: 8px 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #0B6B4B; background: #E1F3EA"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>Incidencias</a>
    <button aria-label="Mi cuenta" style="margin-top: auto; width: 42px; height: 42px; border-radius: 50%; border: 0; background: #0E7C59; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700">V</button>
  </nav>

  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <header style="background: #FFFFFF; border-bottom: 1px solid #E3E7E4; padding: 12px 24px; display: flex; align-items: center; gap: 14px">
      <div style="display: flex; flex-direction: column; margin-right: auto">
        <span style="font-size: 12px; color: #5B6660">Evaluación</span>
        <span style="font-size: 18px; font-weight: 700">Incidencias</span>
      </div>
      <div role="tablist" aria-label="Día" style="display: flex; gap: 6px">
        <button role="tab" style="height: 40px; padding: 0 12px; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #16201B; border: 1px solid #DCE1DD">Todos</button>
        <button role="tab" aria-selected="true" style="height: 40px; padding: 0 12px; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 600; background: #0E7C59; color: #FFFFFF; border: 1px solid #0E7C59">Jue 5</button>
        <button role="tab" style="height: 40px; padding: 0 12px; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #16201B; border: 1px solid #DCE1DD">Vie 6</button>
        <button role="tab" style="height: 40px; padding: 0 12px; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #16201B; border: 1px solid #DCE1DD">Sáb 7</button>
      </div>
      <a href="IncidenciaNuevaWeb.dc.html" style="height: 44px; padding: 0 16px; border-radius: 12px; background: #0E7C59; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Registrar</a>
    </header>

    <div style="flex: 1; display: flex; min-height: 0">
      <section aria-label="Lista" style="width: 460px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #E3E7E4; display: flex; flex-direction: column; min-height: 0">
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 14px 0">
          <div style="border: 1px solid #E3E7E4; border-radius: 12px; padding: 8px 10px"><span style="display: block; font-size: 11px; color: #5B6660">Bonus</span><span style="font-size: 18px; font-weight: 700; color: #0B6B4B">+25</span></div>
          <div style="border: 1px solid #E3E7E4; border-radius: 12px; padding: 8px 10px"><span style="display: block; font-size: 11px; color: #5B6660">Deméritos</span><span style="font-size: 18px; font-weight: 700; color: #A3261F">0</span></div>
          <div style="border: 1px solid #F3DDAE; background: #FFF8EA; border-radius: 12px; padding: 8px 10px"><span style="display: block; font-size: 11px; color: #7A4F00">Por validar</span><span style="font-size: 18px; font-weight: 700; color: #7A4F00">2</span></div>
        </div>
        <div style="display: flex; gap: 6px; padding: 12px 14px; border-bottom: 1px solid #EEF1EF">
          <button style="height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: #16201B; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 600">Todas · 4</button>
          <button style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #DCE1DD; background: #FFFFFF; color: #16201B; font: inherit; font-size: 12px; font-weight: 500">Bonus</button>
          <button style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #DCE1DD; background: #FFFFFF; color: #16201B; font: inherit; font-size: 12px; font-weight: 500">Deméritos</button>
          <button style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #DCE1DD; background: #FFFFFF; color: #16201B; font: inherit; font-size: 12px; font-weight: 500">Por validar</button>
        </div>
        <ul style="list-style: none; margin: 0; padding: 0; overflow-y: auto">
          <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
            <li style="border-bottom: 1px solid #EEF1EF">
              <button onClick="{{it.pick}}" style="{{it.row}}">
                <span style="{{it.codeStyle}}">{{it.code}}</span>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-start">
                  <span style="font-size: 14px; font-weight: 600">{{it.team}} <span style="font-weight: 400; color: #5B6660">· {{it.time}}</span></span>
                  <span style="font-size: 13px; color: #3A4540; line-height: 1.4; text-align: left">{{it.fact}}</span>
                </span>
                <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
                  <span style="{{it.stateStyle}}">{{it.state}}</span>
                  <span style="font-size: 14px; font-weight: 700; color: {{it.ptsColor}}">{{it.pts}}</span>
                </span>
              </button>
            </li>
          </sc-for>
        </ul>
      </section>

      <main style="flex: 1; min-width: 0; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="{{cur.codeStyle}}">{{cur.code}}</span>
          <span style="flex: 1; font-size: 18px; font-weight: 700">{{cur.codeName}}</span>
          <span style="{{cur.stateStyle}}">{{cur.state}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <div style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 12px; padding: 10px 12px"><span style="display: block; font-size: 11px; color: #5B6660">Equipo</span><span style="font-size: 14px; font-weight: 600">{{cur.team}}</span></div>
          <div style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 12px; padding: 10px 12px"><span style="display: block; font-size: 11px; color: #5B6660">Puntos</span><span style="font-size: 14px; font-weight: 700; color: {{cur.ptsColor}}">{{cur.pts}}</span></div>
        </div>
        <div style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #5B6660">Hecho</span>
          <p style="margin: 0; font-size: 14px; line-height: 1.5">{{cur.fact}}</p>
        </div>
        <div style="height: 110px; border-radius: 14px; background: #EEF1EF; border: 1px dashed #DCE1DD; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #5B6660">[Foto de evidencia]</div>
        <textarea aria-label="Descargo del equipo" placeholder="Descargo del equipo: qué dijo al ser escuchado…" style="min-height: 64px; border: 1px solid #DCE1DD; border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 13px; resize: vertical"></textarea>
        <div style="display: flex; gap: 10px">
          <button style="flex: 1; height: 46px; border-radius: 12px; border: 1px solid #DCE1DD; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #A3261F">Rechazar</button>
          <button style="flex: 2; height: 46px; border-radius: 12px; border: 0; background: #0E7C59; font: inherit; font-size: 14px; font-weight: 600; color: #FFFFFF">Validar incidencia</button>
        </div>
      </main>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 1 }; }
  renderVals() {
    const self = this;
    const states = {
      registrado: ['Registrada', 'background: #EEF0EE; color: #4A544F;'],
      descargo: ['En descargo', 'background: #FFF1D6; color: #7A4F00;'],
      validado: ['Validada', 'background: #E1F3EA; color: #0B6B4B;'],
      rechazado: ['Rechazada', 'background: #FDECEC; color: #A3261F;']
    };
    const raw = [
      { code: 'B1', codeName: 'Servicio extraordinario', bonus: true, team: 'Educación', time: '09:13', fact: 'Apoyó con la limpieza de los SS.HH. de damas y varones sin que se le pidiera.', st: 'validado', pts: '+25' },
      { code: 'B2', codeName: 'Cooperación entre equipos', bonus: true, team: 'Nutrición Humana', time: '11:40', fact: 'Prestó su cocina al equipo de Derecho tras la falla de su hornilla.', st: 'descargo', pts: '+25' },
      { code: 'D1', codeName: 'Ruido tras advertencia', bonus: false, team: 'Arquitectura', time: '22:35', fact: 'Ruido después de la hora de silencio, tras la advertencia registrada a las 22:10.', st: 'registrado', pts: '−10' },
      { code: 'B1', codeName: 'Servicio extraordinario', bonus: true, team: 'Educación', time: '09:15', fact: 'Registro duplicado del apoyo en SS.HH.', st: 'rechazado', pts: '+25' }
    ];
    const items = raw.map(function (r, i) {
      const on = self.state.sel === i;
      return Object.assign({}, r, {
        state: states[r.st][0],
        stateStyle: 'font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; white-space: nowrap; ' + states[r.st][1],
        codeStyle: 'flex-shrink: 0; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; ' + (r.bonus ? 'background: #E1F3EA; color: #0B6B4B;' : 'background: #FDECEC; color: #A3261F;'),
        ptsColor: r.st === 'rechazado' ? '#8A948E' : (r.bonus ? '#0B6B4B' : '#A3261F'),
        pick: function () { self.setState({ sel: i }); },
        row: 'width: 100%; display: flex; align-items: flex-start; gap: 12px; padding: 14px; border: 0; font: inherit; color: #16201B; text-align: left; cursor: pointer; ' + (on ? 'background: #E1F3EA;' : 'background: #FFFFFF;')
      });
    });
    return { items: items, cur: items[this.state.sel] };
  }
}
</script>
</body>
</html>
