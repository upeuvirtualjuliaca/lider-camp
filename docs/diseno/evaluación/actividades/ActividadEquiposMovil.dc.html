<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Actividad – equipos – celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F4; font-family: Inter, system-ui, sans-serif; color: #16201B; display: flex; flex-direction: column; overflow: hidden">

  <header style="background: #FFFFFF; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #E3E7E4">
    <div style="display: flex; align-items: center; gap: 8px; min-height: 44px">
      <a href="ActividadesMovil.dc.html" aria-label="Volver a actividades" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-left: -8px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16201B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #5B6660">Jue 5 nov · 16:30</span>
        <span style="font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Programa Apertura y Estelar 1</span>
      </div>
      <span style="font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: #E1F3EA; color: #0B6B4B">Realizada</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; height: 6px; background: #E3E7E4; border-radius: 3px; overflow: hidden"><div style="height: 6px; width: 15%; background: #0E7C59; border-radius: 3px"></div></div>
      <span style="font-size: 12px; color: #5B6660">9 de 60 notas</span>
    </div>
    <div role="tablist" aria-label="Modo" style="display: flex; gap: 24px">
      <button role="tab" onClick="{{pickE}}" style="{{tabE}}">Por equipo</button>
      <button role="tab" onClick="{{pickC}}" style="{{tabC}}">Por criterio</button>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-if value="{{isE}}" hint-placeholder-val="{{ true }}">
      <ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 16px; overflow: hidden">
        <sc-for list="{{teams}}" as="t" hint-placeholder-count="7">
          <li style="border-bottom: 1px solid #EEF1EF">
            <a href="ActividadCalificarMovil.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 0 14px; min-height: 64px">
              <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #FFFFFF; background: {{t.color}}">{{t.initials}}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                <span style="font-size: 15px; font-weight: 600">{{t.name}}</span>
                <span style="display: flex; align-items: center; gap: 8px">
                  <span style="{{t.chip}}">{{t.status}}</span>
                  <span style="font-size: 12px; color: #5B6660">{{t.done}}/5 · {{t.total}} pts</span>
                </span>
              </span>
              <span role="img" aria-label="{{t.pct}} por ciento" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{t.ring}}">
                <span style="width: 32px; height: 32px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">{{t.pct}}%</span>
              </span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A948E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
            </a>
          </li>
        </sc-for>
      </ul>
    </sc-if>
    <sc-if value="{{isC}}" hint-placeholder-val="{{ false }}">
      <ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 16px; overflow: hidden">
        <sc-for list="{{crit}}" as="c" hint-placeholder-count="5">
          <li style="border-bottom: 1px solid #EEF1EF">
            <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 0 14px; min-height: 64px">
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                <span style="font-size: 15px; font-weight: 600">{{c.name}}</span>
                <span style="display: flex; align-items: center; gap: 8px">
                  <span style="{{c.chip}}">{{c.status}}</span>
                  <span style="font-size: 12px; color: #5B6660">{{c.done}}/12 equipos · máx. 80</span>
                </span>
              </span>
              <span role="img" aria-label="{{c.pct}} por ciento" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{c.ring}}">
                <span style="width: 32px; height: 32px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">{{c.pct}}%</span>
              </span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A948E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
            </a>
          </li>
        </sc-for>
      </ul>
    </sc-if>
  </main>

  <nav aria-label="Navegación principal" style="background: #FFFFFF; border-top: 1px solid #E3E7E4; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 18px">
    <a href="InicioMovil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: #5B6660; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: #5B6660; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"></path><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"></path></svg>Evaluar</a>
    <a href="ActividadesMovil.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: #0E7C59; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.9"></path></svg>Actividades</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: #5B6660; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>Incidencias</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: 'e' }; }
  renderVals() {
    const self = this;
    const st = function (done, total) {
      if (done === total) return ['Completo', 'background: #E1F3EA; color: #0B6B4B;'];
      if (done > 0) return ['En curso', 'background: #FFF1D6; color: #7A4F00;'];
      return ['Sin empezar', 'background: #EEF0EE; color: #4A544F;'];
    };
    const chipBase = 'font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; ';
    const teams = [
      { name: 'Administración', initials: 'AD', color: '#1F6FB2', done: 2, total: 135 },
      { name: 'Arquitectura', initials: 'AR', color: '#B4532A', done: 5, total: 340 },
      { name: 'Contabilidad', initials: 'CO', color: '#6B4FA8', done: 2, total: 120 },
      { name: 'Derecho', initials: 'DE', color: '#2E5E8C', done: 0, total: 0 },
      { name: 'Educación', initials: 'ED', color: '#8C4A2E', done: 0, total: 0 },
      { name: 'Enfermería', initials: 'EN', color: '#B23A6B', done: 0, total: 0 },
      { name: 'Ingeniería de Sistemas', initials: 'IS', color: '#0E7C59', done: 0, total: 0 }
    ].map(function (t) {
      const s = st(t.done, 5); const pct = Math.round(t.done / 5 * 100);
      return Object.assign({}, t, { status: s[0], chip: chipBase + s[1], pct: pct, ring: 'conic-gradient(#0E7C59 ' + pct + '%, #E3E7E4 0)' });
    });
    const crit = [
      { name: 'Puntualidad', done: 3 }, { name: 'Asistencia y permanencia', done: 3 },
      { name: 'Participación general', done: 1 }, { name: 'Trabajo en equipo', done: 1 },
      { name: 'Programa cristocéntrico', done: 1 }
    ].map(function (c) {
      const s = st(c.done, 12); const pct = Math.round(c.done / 12 * 100);
      return Object.assign({}, c, { status: s[0], chip: chipBase + s[1], pct: pct, ring: 'conic-gradient(#0E7C59 ' + pct + '%, #E3E7E4 0)' });
    });
    const tab = function (on) {
      return 'border: 0; background: transparent; font: inherit; font-size: 14px; cursor: pointer; padding: 0 0 12px; ' +
        (on ? 'color: #0E7C59; font-weight: 600; box-shadow: inset 0 -2px 0 #0E7C59;' : 'color: #5B6660; font-weight: 500;');
    };
    const e = this.state.mode === 'e';
    return {
      teams: teams, crit: crit, isE: e, isC: !e,
      tabE: tab(e), tabC: tab(!e),
      pickE: function () { self.setState({ mode: 'e' }); },
      pickC: function () { self.setState({ mode: 'c' }); }
    };
  }
}
</script>
</body>
</html>
