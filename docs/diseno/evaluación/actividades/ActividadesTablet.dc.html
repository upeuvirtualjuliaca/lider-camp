<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Actividades – tablet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; background: #F4F6F4; font-family: Inter, system-ui, sans-serif; color: #16201B; display: flex; overflow: hidden">

  <nav aria-label="Menú principal" style="width: 88px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #E3E7E4; display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 6px">
    <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: #0E7C59; display: flex; align-items: center; justify-content: center; margin-bottom: 14px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18L12 4 3 20z"></path><path d="M10 20l2-4 2 4"></path></svg>
    </span>
    <a href="InicioTablet.dc.html" style="width: 72px; padding: 8px 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5B6660">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
    <a href="TabletEquipo.dc.html" style="width: 72px; padding: 8px 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5B6660">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"></path><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"></path></svg>Evaluar</a>
    <a href="#" aria-current="page" style="width: 72px; padding: 8px 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #0B6B4B; background: #E1F3EA">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.9"></path></svg>Actividades</a>
    <a href="#" style="width: 72px; padding: 8px 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #5B6660">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>Incidencias</a>
    <button aria-label="Mi cuenta" style="margin-top: auto; width: 42px; height: 42px; border-radius: 50%; border: 0; background: #0E7C59; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700">V</button>
  </nav>

  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <header style="background: #FFFFFF; border-bottom: 1px solid #E3E7E4; padding: 14px 24px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 16px">
        <div style="display: flex; flex-direction: column; margin-right: auto">
          <span style="font-size: 12px; color: #5B6660">Evaluación</span>
          <span style="font-size: 18px; font-weight: 700">Actividades</span>
        </div>
        <div role="tablist" aria-label="Día" style="display: flex; gap: 6px">
          <button role="tab" aria-selected="true" style="height: 40px; padding: 0 14px; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 600; background: #0E7C59; color: #FFFFFF; border: 1px solid #0E7C59">Jue 5 · 1 act.</button>
          <button role="tab" style="height: 40px; padding: 0 14px; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #16201B; border: 1px solid #DCE1DD">Vie 6 · 2 act.</button>
          <button role="tab" style="height: 40px; padding: 0 14px; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #16201B; border: 1px solid #DCE1DD">Sáb 7 · 1 act.</button>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <button aria-label="Cambiar actividad" style="flex: 1; min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 6px 14px; border-radius: 12px; border: 1px solid #DCE1DD; background: #F4F6F4; font: inherit; color: #16201B; text-align: left; cursor: pointer">
          <span style="font-size: 14px; font-weight: 700; color: #0B6B4B">16:30</span>
          <span style="flex: 1; display: flex; flex-direction: column">
            <span style="font-size: 15px; font-weight: 600">Programa Apertura y Estelar 1</span>
            <span style="font-size: 12px; color: #5B6660">Centro de Concentración · Programas estelares</span>
          </span>
          <span style="font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: #E1F3EA; color: #0B6B4B">Realizada</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6660" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
        <div role="tablist" aria-label="Modo" style="display: flex; padding: 4px; background: #EEF1EF; border-radius: 12px">
          <span role="tab" aria-selected="true" style="height: 36px; padding: 0 16px; border-radius: 9px; display: flex; align-items: center; font-size: 14px; font-weight: 600; color: #0E7C59; background: #FFFFFF; box-shadow: 0 1px 2px rgba(22,32,27,0.12)">Por equipo</span>
          <span role="tab" style="height: 36px; padding: 0 16px; border-radius: 9px; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #5B6660">Por criterio</span>
        </div>
      </div>
    </header>

    <div style="flex: 1; display: flex; min-height: 0">
      <aside aria-label="Equipos" style="width: 300px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #E3E7E4; overflow-y: auto; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
        <sc-for list="{{teams}}" as="t" hint-placeholder-count="8">
          <button onClick="{{t.pick}}" style="{{t.style}}">
            <span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: #FFFFFF; background: {{t.color}}">{{t.initials}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px">
              <span style="font-size: 14px; font-weight: 600">{{t.name}}</span>
              <span style="font-size: 12px; color: #5B6660">{{t.done}}/5 criterios</span>
            </span>
            <span role="img" aria-label="{{t.pct}} por ciento" style="width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{t.ring}}">
              <span style="width: 25px; height: 25px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700">{{t.pct}}%</span>
            </span>
          </button>
        </sc-for>
      </aside>

      <main style="flex: 1; min-width: 0; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 12px; background: #1F6FB2; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">AD</span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 22px; font-weight: 700">Administración</span>
            <span style="font-size: 13px; color: #5B6660">{{done}} de 5 criterios · Subtotal {{total}} / 400</span>
          </div>
          <a href="#" style="height: 42px; padding: 0 14px; border-radius: 12px; background: #0E7C59; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">Siguiente: Arquitectura
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
        </div>
        <div style="height: 6px; background: #E3E7E4; border-radius: 3px; overflow: hidden"><div style="height: 6px; background: #0E7C59; border-radius: 3px; width: {{pct}}%"></div></div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <sc-for list="{{crit}}" as="c" hint-placeholder-count="5">
            <article style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
              <div style="display: flex; align-items: center; gap: 8px">
                <span style="flex: 1; font-size: 15px; font-weight: 600">{{c.name}}</span>
                <span style="{{c.chip}}">{{c.status}}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 10px">
                <button aria-label="Restar 5 a {{c.name}}" onClick="{{c.dec}}" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #DCE1DD; background: #F4F6F4; font: inherit; font-size: 22px; font-weight: 600; color: #16201B; cursor: pointer">−</button>
                <span style="flex: 1; text-align: center; display: flex; align-items: baseline; justify-content: center; gap: 4px">
                  <span style="font-size: 32px; font-weight: 700; color: {{c.valColor}}">{{c.shown}}</span>
                  <span style="font-size: 14px; color: #5B6660">/ 80</span>
                </span>
                <button aria-label="Sumar 5 a {{c.name}}" onClick="{{c.inc}}" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #DCE1DD; background: #F4F6F4; font: inherit; font-size: 22px; font-weight: 600; color: #16201B; cursor: pointer">+</button>
              </div>
              <div role="radiogroup" aria-label="Valores rápidos de {{c.name}}" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
                <sc-for list="{{c.quick}}" as="q" hint-placeholder-count="5">
                  <button role="radio" onClick="{{q.pick}}" style="{{q.style}}">{{q.v}}</button>
                </sc-for>
              </div>
            </article>
          </sc-for>
        </div>
      </main>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 'ad', v: { pu: 60, as: 75, pa: null, te: null, pc: null } }; }
  renderVals() {
    const self = this;
    const base = [
      { id: 'ad', name: 'Administración', initials: 'AD', color: '#1F6FB2', done: 2 },
      { id: 'ar', name: 'Arquitectura', initials: 'AR', color: '#B4532A', done: 5 },
      { id: 'co', name: 'Contabilidad', initials: 'CO', color: '#6B4FA8', done: 2 },
      { id: 'de', name: 'Derecho', initials: 'DE', color: '#2E5E8C', done: 0 },
      { id: 'ed', name: 'Educación', initials: 'ED', color: '#8C4A2E', done: 0 },
      { id: 'en', name: 'Enfermería', initials: 'EN', color: '#B23A6B', done: 0 },
      { id: 'is', name: 'Ingeniería de Sistemas', initials: 'IS', color: '#0E7C59', done: 0 },
      { id: 'mh', name: 'Medicina Humana', initials: 'MH', color: '#5A6B12', done: 0 }
    ];
    const teams = base.map(function (t) {
      const on = self.state.sel === t.id;
      const pct = Math.round(t.done / 5 * 100);
      return Object.assign({}, t, {
        pct: pct, ring: 'conic-gradient(#0E7C59 ' + pct + '%, #E3E7E4 0)',
        pick: function () { self.setState({ sel: t.id }); },
        style: 'display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 6px 8px; border-radius: 12px; font: inherit; color: #16201B; text-align: left; cursor: pointer; ' +
          (on ? 'background: #E1F3EA; border: 1px solid #0E7C59;' : 'background: #FFFFFF; border: 1px solid transparent;')
      });
    });
    const defs = [
      { id: 'pu', name: 'Puntualidad' }, { id: 'as', name: 'Asistencia y permanencia' },
      { id: 'pa', name: 'Participación general' }, { id: 'te', name: 'Trabajo en equipo' },
      { id: 'pc', name: 'Programa cristocéntrico' }
    ];
    const v = this.state.v;
    const set = function (id, val) { const x = Object.assign({}, self.state.v); x[id] = Math.max(0, Math.min(80, val)); self.setState({ v: x }); };
    let done = 0, total = 0;
    const crit = defs.map(function (d) {
      const val = v[d.id];
      const has = val !== null && val !== undefined;
      if (has) { done++; total += val; }
      return {
        name: d.name, shown: has ? val : '—', valColor: has ? '#16201B' : '#8A948E',
        status: has ? 'Guardado' : 'Pendiente',
        chip: 'font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; ' + (has ? 'background: #E1F3EA; color: #0B6B4B;' : 'background: #EEF0EE; color: #4A544F;'),
        dec: function () { set(d.id, (has ? val : 0) - 5); },
        inc: function () { set(d.id, (has ? val : 0) + 5); },
        quick: [0, 20, 40, 60, 80].map(function (q) {
          const on = val === q;
          return { v: q, pick: function () { set(d.id, q); },
            style: 'height: 34px; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ' +
              (on ? 'background: #0E7C59; color: #FFFFFF; border: 1px solid #0E7C59;' : 'background: #FFFFFF; color: #16201B; border: 1px solid #DCE1DD;') };
        })
      };
    });
    return { teams: teams, crit: crit, done: done, total: total, pct: Math.round(done / 5 * 100) };
  }
}
</script>
</body>
</html>
