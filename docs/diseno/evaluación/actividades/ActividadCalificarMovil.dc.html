<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Actividad – calificar equipo – celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F4; font-family: Inter, system-ui, sans-serif; color: #16201B; display: flex; flex-direction: column; overflow: hidden">

  <header style="background: #FFFFFF; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #E3E7E4">
    <div style="display: flex; align-items: center; gap: 8px; min-height: 44px">
      <a href="ActividadEquiposMovil.dc.html" aria-label="Volver a equipos" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-left: -8px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16201B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #1F6FB2; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">AD</span>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 17px; font-weight: 700">Administración</span>
        <span style="font-size: 12px; color: #5B6660; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Programa Apertura y Estelar 1</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end">
        <span style="font-size: 16px; font-weight: 700">{{total}}<span style="font-size: 12px; font-weight: 500; color: #5B6660">/400</span></span>
        <span style="font-size: 11px; color: #5B6660">{{done}} de 5</span>
      </div>
    </div>
    <div style="height: 6px; background: #E3E7E4; border-radius: 3px; overflow: hidden"><div style="height: 6px; background: #0E7C59; border-radius: 3px; width: {{pct}}%"></div></div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{crit}}" as="c" hint-placeholder-count="5">
      <article style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="flex: 1; font-size: 15px; font-weight: 600">{{c.name}}</span>
          <span style="{{c.chip}}">{{c.status}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <button aria-label="Restar 5 a {{c.name}}" onClick="{{c.dec}}" style="width: 52px; height: 52px; border-radius: 14px; border: 1px solid #DCE1DD; background: #F4F6F4; font: inherit; font-size: 24px; font-weight: 600; color: #16201B; cursor: pointer">−</button>
          <span style="flex: 1; text-align: center; display: flex; align-items: baseline; justify-content: center; gap: 4px">
            <span style="font-size: 34px; font-weight: 700; color: {{c.valColor}}">{{c.shown}}</span>
            <span style="font-size: 14px; color: #5B6660">/ 80</span>
          </span>
          <button aria-label="Sumar 5 a {{c.name}}" onClick="{{c.inc}}" style="width: 52px; height: 52px; border-radius: 14px; border: 1px solid #DCE1DD; background: #F4F6F4; font: inherit; font-size: 24px; font-weight: 600; color: #16201B; cursor: pointer">+</button>
        </div>
        <div role="radiogroup" aria-label="Valores rápidos de {{c.name}}" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{c.quick}}" as="q" hint-placeholder-count="5">
            <button role="radio" onClick="{{q.pick}}" style="{{q.style}}">{{q.v}}</button>
          </sc-for>
        </div>
      </article>
    </sc-for>
  </main>

  <footer style="background: #FFFFFF; border-top: 1px solid #E3E7E4; padding: 12px 16px 22px; display: flex; gap: 10px">
    <a href="ActividadEquiposMovil.dc.html" style="height: 50px; padding: 0 18px; border-radius: 14px; border: 1px solid #DCE1DD; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Anterior</a>
    <a href="ActividadEquiposMovil.dc.html" style="flex: 1; height: 50px; border-radius: 14px; background: #0E7C59; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600">Siguiente: Arquitectura
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { v: { pu: 60, as: 75, pa: null, te: null, pc: null } }; }
  renderVals() {
    const self = this;
    const defs = [
      { id: 'pu', name: 'Puntualidad' }, { id: 'as', name: 'Asistencia y permanencia' },
      { id: 'pa', name: 'Participación general' }, { id: 'te', name: 'Trabajo en equipo' },
      { id: 'pc', name: 'Programa cristocéntrico' }
    ];
    const v = this.state.v;
    const set = function (id, val) { const x = Object.assign({}, self.state.v); x[id] = Math.max(0, Math.min(80, val)); self.setState({ v: x }); };
    let done = 0, total = 0;
    const crit = defs.map(function (d) {
      const val = v[d.id];
      const has = val !== null && val !== undefined;
      if (has) { done++; total += val; }
      return {
        name: d.name, shown: has ? val : '—', valColor: has ? '#16201B' : '#8A948E',
        status: has ? 'Guardado' : 'Pendiente',
        chip: 'font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; ' + (has ? 'background: #E1F3EA; color: #0B6B4B;' : 'background: #EEF0EE; color: #4A544F;'),
        dec: function () { set(d.id, (has ? val : 0) - 5); },
        inc: function () { set(d.id, (has ? val : 0) + 5); },
        quick: [0, 20, 40, 60, 80].map(function (q) {
          const on = val === q;
          return { v: q, pick: function () { set(d.id, q); },
            style: 'height: 40px; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' +
              (on ? 'background: #0E7C59; color: #FFFFFF; border: 1px solid #0E7C59;' : 'background: #FFFFFF; color: #16201B; border: 1px solid #DCE1DD;') };
        })
      };
    });
    return { crit: crit, done: done, total: total, pct: Math.round(done / 5 * 100) };
  }
}
</script>
</body>
</html>
