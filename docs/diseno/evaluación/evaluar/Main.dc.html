<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Evaluar – lista de equipos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6F4; font-family: Inter, system-ui, sans-serif; color: #16201B; display: flex; flex-direction: column; overflow: hidden">

  <header style="background: #FFFFFF; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid #E3E7E4">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
      <button aria-label="Abrir menú" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #16201B; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
      <div style="display: flex; flex-direction: column; align-items: center">
        <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.2px">Evaluar</span>
        <span style="font-size: 12px; color: #5B6660">LiderCamp 2026-II</span>
      </div>
      <button aria-label="Mi cuenta" style="width: 36px; height: 36px; border-radius: 50%; border: 0; background: #0E7C59; color: #FFFFFF; font-weight: 600; font-size: 14px; cursor: pointer">V</button>
    </div>

    <div role="tablist" aria-label="Día a evaluar" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
        <button role="tab" onClick="{{d.pick}}" style="{{d.style}}">
          <span style="font-size: 13px; font-weight: 600">{{d.label}}</span>
          <span style="font-size: 11px; opacity: 0.85">{{d.sub}}</span>
        </button>
      </sc-for>
    </div>

    <div role="tablist" aria-label="Modo de evaluación" style="display: flex; gap: 24px; margin-top: 2px">
      <button role="tab" onClick="{{pickEquipo}}" style="{{tabEquipo}}">Por equipo</button>
      <a href="Criterios.dc.html" role="tab" style="font-size: 14px; font-weight: 500; color: #5B6660; padding: 0 0 12px">Por criterio</a>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px">

    <section aria-label="Avance del día" style="background: #0E7C59; color: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 13px; opacity: 0.9">Avance de {{dayName}}</span>
        <span style="font-size: 13px; opacity: 0.9">{{doneTotal}} de {{allTotal}} notas</span>
      </div>
      <span style="font-size: 32px; font-weight: 700; letter-spacing: -0.5px">{{dayPct}}%</span>
      <div style="height: 6px; background: rgba(255,255,255,0.25); border-radius: 3px; overflow: hidden">
        <div style="height: 6px; background: #FFFFFF; border-radius: 3px; width: {{dayPct}}%"></div>
      </div>
    </section>

    <label style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 1px solid #DCE1DD; border-radius: 12px; padding: 0 14px; height: 46px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6660" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar equipo</span>
      <input type="search" placeholder="Buscar equipo" style="border: 0; outline: none; flex: 1; font: inherit; font-size: 15px; background: transparent; color: #16201B">
    </label>

    <div style="display: flex; gap: 8px">
      <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 0; background: #16201B; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600">Todos · 6</button>
      <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #DCE1DD; background: #FFFFFF; color: #16201B; font: inherit; font-size: 13px; font-weight: 500">Pendientes · 5</button>
      <button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid #DCE1DD; background: #FFFFFF; color: #16201B; font: inherit; font-size: 13px; font-weight: 500">Completos · 1</button>
    </div>

    <ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border-radius: 16px; border: 1px solid #E3E7E4; overflow: hidden">
      <sc-for list="{{teams}}" as="t" hint-placeholder-count="6">
        <li style="border-bottom: 1px solid #EEF1EF">
          <a href="Calificar.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 64px; box-sizing: border-box">
            <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #FFFFFF; background: {{t.color}}">{{t.initials}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span>
              <span style="display: flex; align-items: center; gap: 8px">
                <span style="{{t.chip}}">{{t.status}}</span>
                <span style="font-size: 12px; color: #5B6660">{{t.done}}/{{t.total}} criterios</span>
              </span>
            </span>
            <span role="img" aria-label="{{t.pct}} por ciento" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{t.ring}}">
              <span style="width: 32px; height: 32px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #16201B">{{t.pct}}%</span>
            </span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A948E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
          </a>
        </li>
      </sc-for>
    </ul>
  </main>

  <nav aria-label="Navegación principal" style="background: #FFFFFF; border-top: 1px solid #E3E7E4; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 18px">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: #0E7C59; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"></path><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"></path></svg>
      Evaluar
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: #5B6660; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.9"></path></svg>
      Asistencia
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: #5B6660; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
      Incidencias
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: #5B6660; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path></svg>
      Ranking
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { day: 0, mode: 'equipo' }; }
  renderVals() {
    const self = this;
    const dayDefs = [
      { label: 'Jue 5', sub: 'Hoy · 47%', name: 'hoy', f: [29, 17, 6, 0, 22, 8] },
      { label: 'Vie 6', sub: 'Sin iniciar', name: 'viernes', f: [0, 0, 0, 0, 0, 0] },
      { label: 'Sáb 7', sub: 'Sin iniciar', name: 'sábado', f: [0, 0, 0, 0, 0, 0] }
    ];
    const days = dayDefs.map(function (d, i) {
      const on = self.state.day === i;
      return {
        label: d.label, sub: d.sub,
        pick: function () { self.setState({ day: i }); },
        style: 'height: 52px; border-radius: 12px; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; ' +
          (on ? 'background: #0E7C59; color: #FFFFFF; border: 1px solid #0E7C59;' : 'background: #FFFFFF; color: #16201B; border: 1px solid #DCE1DD;')
      };
    });
    const base = [
      { name: 'Administración', initials: 'AD', color: '#1F6FB2' },
      { name: 'Arquitectura', initials: 'AR', color: '#B4532A' },
      { name: 'Contabilidad', initials: 'CO', color: '#6B4FA8' },
      { name: 'Enfermería', initials: 'EN', color: '#B23A6B' },
      { name: 'Ingeniería de Sistemas', initials: 'IS', color: '#0E7C59' },
      { name: 'Medicina Humana', initials: 'MH', color: '#5A6B12' }
    ];
    const total = 29;
    const f = dayDefs[this.state.day].f;
    let sum = 0;
    const teams = base.map(function (t, i) {
      const done = f[i]; sum += done;
      const pct = Math.round(done / total * 100);
      let status = 'Sin empezar', chip = 'background: #EEF0EE; color: #4A544F;';
      if (done === total) { status = 'Completo'; chip = 'background: #E1F3EA; color: #0B6B4B;'; }
      else if (done > 0) { status = 'En curso'; chip = 'background: #FFF1D6; color: #7A4F00;'; }
      return Object.assign({}, t, {
        done: done, total: total, pct: pct, status: status,
        chip: 'font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; ' + chip,
        ring: 'conic-gradient(#0E7C59 ' + pct + '%, #E3E7E4 0)'
      });
    });
    const all = total * base.length;
    const tab = function (on) {
      return 'border: 0; background: transparent; font: inherit; font-size: 14px; cursor: pointer; padding: 0 0 12px; ' +
        (on ? 'color: #0E7C59; font-weight: 600; box-shadow: inset 0 -2px 0 #0E7C59;' : 'color: #5B6660; font-weight: 500;');
    };
    return {
      days: days, teams: teams,
      dayName: dayDefs[this.state.day].name,
      doneTotal: sum, allTotal: all, dayPct: Math.round(sum / all * 100),
      tabEquipo: tab(this.state.mode === 'equipo'),
      tabCriterio: tab(this.state.mode === 'criterio'),
      pickEquipo: function () { self.setState({ mode: 'equipo' }); },
      pickCriterio: function () { self.setState({ mode: 'criterio' }); }
    };
  }
}
</script>
</body>
</html>
