<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tablet – evaluar por equipo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; background: #F4F6F4; font-family: Inter, system-ui, sans-serif; color: #16201B; display: flex; flex-direction: column; overflow: hidden">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E3E7E4; height: 72px; padding: 0 24px; display: flex; align-items: center; gap: 24px">
    <div style="display: flex; flex-direction: column; min-width: 170px">
      <span style="font-size: 18px; font-weight: 700">Evaluar</span>
      <span style="font-size: 12px; color: #5B6660">LiderCamp 2026-II</span>
    </div>
    <div role="tablist" aria-label="Día a evaluar" style="display: flex; gap: 8px">
      <button role="tab" style="height: 44px; padding: 0 16px; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #16201B; border: 1px solid #DCE1DD">Jue 5 · 100%</button>
      <button role="tab" style="height: 44px; padding: 0 16px; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 600; background: #FFFFFF; color: #16201B; border: 1px solid #DCE1DD">Vie 6 · 82%</button>
      <button role="tab" aria-selected="true" style="height: 44px; padding: 0 16px; border-radius: 12px; font: inherit; font-size: 13px; font-weight: 600; background: #0E7C59; color: #FFFFFF; border: 1px solid #0E7C59">Sáb 7 · 38%</button>
    </div>
    <div role="tablist" aria-label="Modo de evaluación" style="display: flex; padding: 4px; background: #EEF1EF; border-radius: 12px; margin-left: auto">
      <span role="tab" aria-selected="true" style="height: 36px; padding: 0 16px; border-radius: 9px; display: flex; align-items: center; font-size: 14px; font-weight: 600; color: #0E7C59; background: #FFFFFF; box-shadow: 0 1px 2px rgba(22,32,27,0.12)">Por equipo</span>
      <a href="TabletCriterio.dc.html" role="tab" style="height: 36px; padding: 0 16px; border-radius: 9px; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #5B6660">Por criterio</a>
    </div>
    <button aria-label="Mi cuenta" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: #0E7C59; color: #FFFFFF; font-weight: 600; font-size: 15px">V</button>
  </header>

  <div style="flex: 1; display: flex; min-height: 0">
    <aside aria-label="Equipos" style="width: 340px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #E3E7E4; overflow-y: auto; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
      <label style="display: flex; align-items: center; gap: 10px; background: #F4F6F4; border: 1px solid #DCE1DD; border-radius: 12px; padding: 0 12px; height: 42px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6660" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar equipo</span>
        <input type="search" placeholder="Buscar equipo" style="border: 0; outline: none; flex: 1; font: inherit; font-size: 14px; background: transparent; color: #16201B">
      </label>
      <div style="display: flex; gap: 6px">
        <button style="height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: #16201B; color: #FFFFFF; font: inherit; font-size: 12px; font-weight: 600">Todos · 12</button>
        <button style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #DCE1DD; background: #FFFFFF; color: #16201B; font: inherit; font-size: 12px; font-weight: 500">Pendientes · 11</button>
      </div>
      <sc-for list="{{teams}}" as="t" hint-placeholder-count="8">
        <button onClick="{{t.pick}}" style="{{t.style}}">
          <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #FFFFFF; background: {{t.color}}">{{t.initials}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px">
            <span style="font-size: 14px; font-weight: 600">{{t.name}}</span>
            <span style="font-size: 12px; color: #5B6660">{{t.done}}/13 criterios</span>
          </span>
          <span role="img" aria-label="{{t.pct}} por ciento" style="width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{t.ring}}">
            <span style="width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700">{{t.pct}}%</span>
          </span>
        </button>
      </sc-for>
    </aside>

    <main style="flex: 1; min-width: 0; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 14px">
        <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 14px; background: #B4532A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px">AR</span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 26px; font-weight: 700; letter-spacing: -0.3px">Arquitectura</span>
          <span style="font-size: 13px; color: #5B6660">Sáb 7 nov · {{done}} de 13 criterios calificados</span>
        </div>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #0B6B4B">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
          Guardado
        </span>
        <a href="#" style="height: 44px; padding: 0 16px; border-radius: 12px; background: #0E7C59; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">
          Siguiente: Contabilidad
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </a>
      </div>
      <div style="height: 6px; background: #E3E7E4; border-radius: 3px; overflow: hidden">
        <div style="height: 6px; background: #0E7C59; border-radius: 3px; width: {{pct}}%"></div>
      </div>

      <h2 style="margin: 6px 2px 0; font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #5B6660">Armado del campamento</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{items}}" as="c" hint-placeholder-count="4">
          <article style="background: #FFFFFF; border: 1px solid #E3E7E4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="flex: 1; font-size: 15px; font-weight: 600">{{c.name}}</span>
              <span style="font-size: 11px; font-weight: 600; color: #5B6660">máx. {{c.max}}</span>
              <button aria-label="Qué se evalúa en {{c.name}}" style="width: 32px; height: 32px; border-radius: 50%; border: 1px solid #DCE1DD; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5B6660" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
              </button>
            </div>
            <div role="radiogroup" aria-label="Nota de {{c.name}}" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
              <sc-for list="{{c.opts}}" as="o" hint-placeholder-count="5">
                <button role="radio" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
              </sc-for>
            </div>
            <span style="font-size: 12px; color: {{c.descColor}}; line-height: 1.4">{{c.desc}}</span>
          </article>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 'ar', notas: { carpas: 3, cerco: 4, basurero: null, tendedero: null } }; }
  renderVals() {
    const self = this;
    const base = [
      { id: 'ad', name: 'Administración', initials: 'AD', color: '#1F6FB2', done: 13 },
      { id: 'ar', name: 'Arquitectura', initials: 'AR', color: '#B4532A', done: 6 },
      { id: 'co', name: 'Contabilidad', initials: 'CO', color: '#6B4FA8', done: 4 },
      { id: 'de', name: 'Derecho', initials: 'DE', color: '#2E5E8C', done: 2 },
      { id: 'en', name: 'Enfermería', initials: 'EN', color: '#B23A6B', done: 5 },
      { id: 'is', name: 'Ingeniería de Sistemas', initials: 'IS', color: '#0E7C59', done: 7 },
      { id: 'mh', name: 'Medicina Humana', initials: 'MH', color: '#5A6B12', done: 3 },
      { id: 'nu', name: 'Nutrición', initials: 'NU', color: '#8C4A2E', done: 0 }
    ];
    const teams = base.map(function (t) {
      const on = self.state.sel === t.id;
      const pct = Math.round(t.done / 13 * 100);
      return Object.assign({}, t, {
        pct: pct,
        ring: 'conic-gradient(#0E7C59 ' + pct + '%, #E3E7E4 0)',
        pick: function () { self.setState({ sel: t.id }); },
        style: 'display: flex; align-items: center; gap: 10px; width: 100%; min-height: 60px; padding: 8px 10px; border-radius: 12px; font: inherit; color: #16201B; text-align: left; cursor: pointer; ' +
          (on ? 'background: #E1F3EA; border: 1px solid #0E7C59;' : 'background: #FFFFFF; border: 1px solid transparent;')
      });
    });
    const desc = [
      'No realiza la acción pese a contar con oportunidad y apoyos.',
      'Avance mínimo o depende de ayuda constante.',
      'Cumple parcialmente y requiere acompañamiento frecuente.',
      'Cumple lo esencial; omisión menor o requiere un recordatorio.',
      'Cumple todos los aspectos, con autonomía y dentro del plazo.'
    ];
    const defs = [
      { id: 'carpas', name: 'Carpas', max: 50 },
      { id: 'cerco', name: 'Cerco', max: 50 },
      { id: 'basurero', name: 'Basurero', max: 50 },
      { id: 'tendedero', name: 'Tendedero', max: 50 }
    ];
    const notas = this.state.notas;
    let n = 0;
    const items = defs.map(function (d) {
      const s = notas[d.id];
      const has = s !== null && s !== undefined;
      if (has) n++;
      return {
        name: d.name, max: d.max,
        opts: [0, 1, 2, 3, 4].map(function (lv) {
          const on = s === lv;
          return {
            label: String(d.max * lv / 4).replace('.', ','),
            pick: function () { const x = Object.assign({}, self.state.notas); x[d.id] = lv; self.setState({ notas: x }); },
            style: 'height: 48px; border-radius: 12px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; ' +
              (on ? 'background: #0E7C59; color: #FFFFFF; border: 1px solid #0E7C59;' : 'background: #F4F6F4; color: #16201B; border: 1px solid #DCE1DD;')
          };
        }),
        desc: has ? desc[s] : 'Pendiente · toca una nota para calificar',
        descColor: has ? '#16201B' : '#5B6660'
      };
    });
    const done = 4 + n;
    return { teams: teams, items: items, done: done, pct: Math.round(done / 13 * 100) };
  }
}
</script>
</body>
</html>
